name: Build Cloud SD Card APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build APK, show SHA-1, and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle/libs.versions.toml
          test -f app/build.gradle.kts
          grep -q 'applicationId = "com.aprax.csd"' app/build.gradle.kts
          echo "Project files and application ID validated: com.aprax.csd"

      - name: Install persistent debug signing key
        shell: bash
        run: |
          set -euo pipefail
          test -s signing/csd-debug.keystore
          mkdir -p "$HOME/.android"
          install -m 600 signing/csd-debug.keystore "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA256:'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK and print signing certificate fingerprints
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK generated: $APK"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK path was not provided by the runner." >&2
            exit 1
          fi
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found in Android SDK build-tools." >&2
            exit 1
          fi

          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s\n' "$CERT_OUTPUT"
          SHA1="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/.*certificate SHA-1 digest: *//p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          SHA256="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/.*certificate SHA-256 digest: *//p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          if [ -z "$SHA1" ]; then
            echo "ERROR: Could not extract SHA-1 fingerprint from APK certificate." >&2
            exit 1
          fi

          echo "APK SIGNING CERTIFICATE SHA-1: $SHA1"
          echo "APK SIGNING CERTIFICATE SHA-256: ${SHA256:-unavailable}"
          {
            echo "## APK signing certificate fingerprints"
            echo
            echo "- **Package:** \`com.aprax.csd\`"
            echo "- **SHA-1:** \`$SHA1\`"
            echo "- **SHA-256:** \`${SHA256:-unavailable}\`"
            echo
            echo "Use the SHA-1 for the Android OAuth client that matches this APK's signing certificate."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256:-unavailable}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudSDCard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: Cloud SD Card Debug APK — Build ${{ github.run_number }}.${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          body: |
            Automatically generated debug APK for Cloud SD Card.

            - Built by GitHub Actions.
            - Run number: ${{ github.run_number }}
            - Run attempt: ${{ github.run_attempt }}
            - Source commit SHA: ${{ github.sha }}
            - Package name: `com.aprax.csd`
            - Intended for testing only; this is not a Play Store production release.
            - Signed with the project's persistent debug-only keystore so the SHA-1 remains stable across GitHub Actions builds.
            - The exact APK signing certificate SHA-1 and SHA-256 are printed in the workflow logs and build summary.
            - Debug key only; do not use this key for a production/Play Store release.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
          make_latest: true
